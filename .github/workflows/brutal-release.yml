name: Brutal Morrowind V1.0 release

on:
  push:
    tags:
      - v1.0

permissions:
  contents: write

concurrency:
  group: brutal-morrowind-stable-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Fetch the pinned tested source and binary report
        run: |
          $m = Get-Content CI/brutal-release.json -Raw | ConvertFrom-Json
          git fetch --no-tags --depth=1 origin $m.baselineSource $m.baselineReport
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the pinned baseline.' }

      - name: Verify and promote the existing runtime without compilation
        run: |
          python CI/package-brutal-release.py --from-report --output dist 2>&1 | Tee-Object package-release.log
          if ($LASTEXITCODE -ne 0) { throw 'Release package validation failed.' }

      - name: Check the installed Windows executable
        run: |
          Expand-Archive dist/Brutal-Morrowind-1.0-Windows-x64.zip -DestinationPath runtime
          $runtime = Join-Path $PWD 'runtime/Brutal-Morrowind-1.0-Windows-x64'
          $process = Start-Process (Join-Path $runtime 'openmw.exe') -ArgumentList '--version' -WorkingDirectory $runtime -Wait -PassThru -RedirectStandardOutput installed-version.log -RedirectStandardError installed-version-errors.log
          if ($process.ExitCode -ne 0) { throw 'Release runtime did not start.' }
          if (-not ((Get-Content installed-version.log -Raw).Contains('Revision: 436addc398'))) { throw 'Unexpected binary revision.' }

      - name: Publish stable release and verify downloaded assets
        run: |
          python CI/publish-brutal-release.py
          if ($LASTEXITCODE -ne 0) { throw 'Stable release publication failed.' }

      - name: Retain release packages and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Brutal-Morrowind-V1.0
          path: |
            dist/*
            installed-version*.log
            package-release.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish packaging diagnostics if a step fails
        if: failure()
        run: python CI/publish-brutal-release.py --report-failure
