name: Brutal Morrowind - Windows x64

on:
  push:
    branches:
      - experimental/ragdoll-*
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a downloadable prerelease after all checks pass
        required: false
        type: boolean
        default: false

# Only trusted source branches run this workflow; no pull-request trigger.
permissions:
  contents: write

concurrency:
  group: realcombat-ragdoll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # A retained, fully compiled candidate can be published without rebuilding
    # when only validation expectations or packaging documentation change.
    if: ${{ !contains(github.event.head_commit.message, '[publish-only]') }}
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Publish initial build status
        run: ./CI/ragdoll-report.ps1 -Stage dependencies -Result running

      - name: Activate MSVC 2022 for x64
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64
          vsversion: '2022'

      - name: Download and verify pinned upstream dependencies
        run: ./CI/ragdoll-windows.ps1 -Phase Dependencies

      - name: Configure the runtime and physics tests
        run: |
          ./CI/ragdoll-report.ps1 -Stage configure -Result running
          ./CI/ragdoll-windows.ps1 -Phase Configure

      - name: Build and run physics, synthetic skeleton and lethal-hit attribution tests
        run: |
          ./CI/ragdoll-report.ps1 -Stage ragdoll-tests -Result running
          ./CI/ragdoll-windows.ps1 -Phase RagdollTests

      - name: Compile the modified engine
        id: build
        run: |
          ./CI/ragdoll-report.ps1 -Stage build -Result running
          ./CI/ragdoll-windows.ps1 -Phase Build

      - name: Retain the compiled runtime before building tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Brutal-Morrowind-compiled-checkpoint-${{ github.sha }}
          path: |
            build/openmw.exe
            build/defaults.bin
            build/openmw.cfg
            build/resources
          if-no-files-found: error
          retention-days: 30

      - name: Compile and run component and native tests
        id: tests
        run: |
          ./CI/ragdoll-report.ps1 -Stage tests -Result running
          ./CI/ragdoll-windows.ps1 -Phase Test

      - name: Package a standalone runtime and check its DLLs
        id: package
        # Retain the compiled candidate for diagnosis if a late test fails.
        # The failed test still fails the job and is recorded inside the ZIP.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          RAGDOLL_TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          ./CI/ragdoll-report.ps1 -Stage package -Result running
          ./CI/ragdoll-windows.ps1 -Phase Package

      - name: Upload the Windows package
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Brutal-Morrowind-Windows-x64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish the downloadable prerelease
        if: steps.tests.outcome == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.publish_release) || github.ref == 'refs/heads/experimental/ragdoll-active-combat')
        run: |
          ./CI/ragdoll-report.ps1 -Stage publish -Result running
          ./CI/ragdoll-windows.ps1 -Phase Publish

      - name: Publish final status and bounded diagnostic logs through Git
        if: always()
        env:
          BUILD_RESULT: ${{ job.status }}
        run: ./CI/ragdoll-report.ps1 -Stage completed -Result $env:BUILD_RESULT

      - name: Preserve full build and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ragdoll-build-logs-${{ github.sha }}
          path: |
            ragdoll-logs/*
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build-ragdoll-tests/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30

  combat-release-notes:
    if: github.ref == 'refs/heads/experimental/ragdoll-active-combat' && contains(github.event.head_commit.message, '[publish-only]') && !contains(github.event.head_commit.message, '[publish-retained]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Update notes on the already compiled experimental release
        run: gh release edit brutal-1.3-combat.4 --repo "$GITHUB_REPOSITORY" --notes-file docs/combat-release-notes.md --prerelease --latest=false

  retained-combat-release:
    if: github.ref == 'refs/heads/experimental/ragdoll-active-combat' && contains(github.event.head_commit.message, '[publish-retained]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Verify and package the retained engine without compilation
        run: python3 CI/publish-retained-combat.py
      - name: Publish the retained candidate with its failed test disclosed
        run: |
          set +e
          gh release create brutal-1.3-combat.3 --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Brutal Morrowind 1.3-combat.3 - Windows x64" \
            --prerelease --latest=false --notes-file docs/combat-release-notes.md \
            dist-retained/*.zip dist-retained/SHA256SUMS dist-retained/package.json > publication.log 2>&1
          result=$?
          cat publication.log
          python3 - <<'PY'
          import os
          from pathlib import Path
          log=Path('publication.log').read_text()
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('### Retained release publication\n\n```text\n'+log[-12000:]+'\n```\n')
          PY
          exit "$result"
