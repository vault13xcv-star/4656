name: Read-only ragdoll build diagnostics
on:
  push:
    branches:
      - diagnostics/ragdoll-*
permissions:
  actions: read
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_DIAGNOSTIC_TOKEN: ${{ github.token }}
    steps:
      - name: Read the existing build and publish a safe status report
        shell: python
        run: |
          import base64
          import datetime
          import json
          import os
          import pathlib
          import subprocess
          import tempfile
          import urllib.error
          import urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          target_run = '39074115129'
          token = os.environ['GH_DIAGNOSTIC_TOKEN']
          headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          report = {'targetRun': target_run, 'updatedUtc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'run': None, 'jobs': [], 'errors': []}
          def read(path):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  report['errors'].append({'path': path, 'status': error.code})
                  return {}
          result = read('/actions/runs/' + target_run)
          report['run'] = {key: result.get(key) for key in ('id', 'name', 'status', 'conclusion', 'head_sha', 'run_attempt', 'created_at', 'updated_at', 'run_started_at', 'html_url')}
          result = read('/actions/runs/' + target_run + '/jobs?per_page=100')
          for job in result.get('jobs', []):
              item = {key: job.get(key) for key in ('id', 'name', 'status', 'conclusion', 'started_at', 'completed_at', 'html_url', 'runner_name')}
              item['steps'] = [{key: step.get(key) for key in ('number', 'name', 'status', 'conclusion', 'started_at', 'completed_at')} for step in job.get('steps', [])]
              report['jobs'].append(item)
          directory = pathlib.Path(tempfile.mkdtemp(prefix='ragdoll-diagnostic-'))
          branch = 'build-results/ragdoll-diagnostic-' + target_run + '-' + os.environ['GITHUB_RUN_ID']
          report['resultsBranch'] = branch
          (directory / 'status.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          def git(*args):
              proc = subprocess.run(['git', '-C', str(directory), *args], text=True, capture_output=True)
              if proc.returncode:
                  raise RuntimeError('Git report publication failed, exit code ' + str(proc.returncode))
          git('init', '--initial-branch', branch)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          auth = base64.b64encode(('x-access-token:' + token).encode()).decode()
          git('config', 'http.https://github.com/.extraheader', 'AUTHORIZATION: basic ' + auth)
          git('remote', 'add', 'origin', 'https://github.com/' + repo + '.git')
          git('add', '--', 'status.json')
          git('commit', '-m', 'Report existing ragdoll build status')
          git('push', 'origin', 'HEAD:refs/heads/' + branch)
          print(json.dumps(report, ensure_ascii=False, indent=2))
